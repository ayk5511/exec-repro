[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exec-repro"
version = "0.1.0"
description = "Execution-based reproducibility measurement: run a paper's released code and record how far it gets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Akram Khan", email = "1819ak@gmail.com" },
]
keywords = [
  "reproducibility",
  "research-artefacts",
  "computational-reproducibility",
  "machine-learning",
  "quantitative-finance",
  "meta-science",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "certifi>=2023.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
exec-repro = "exec_repro.cli:main"

[project.urls]
Homepage = "https://github.com/ayk5511/exec-repro"
Repository = "https://github.com/ayk5511/exec-repro"
Issues = "https://github.com/ayk5511/exec-repro/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/exec_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires a container runtime and network access",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]
